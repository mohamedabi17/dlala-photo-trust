<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="How a copied photo is found, even inside a screenshot. A screenshot of a listing page arrives. Step 1: the photo rectangle inside the page is found. Step 2: its fingerprints, a PDQ hash and a DINOv2 vector, are compared with the stored photos. Step 3: matching points between the two photos are checked geometrically. Result: a copy, with a side-by-side picture as proof; no matching points, no copy. Screenshots found: 18% for the best published method, 76.3% for this system, measured on different photo sets." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>How a copied photo is found, even inside a screenshot. A screenshot of a listing page arrives. Step 1: the photo rectangle inside the page is found. Step 2: its fingerprints, a PDQ hash and a DINOv2 vector, are compared with the stored photos. Step 3: matching points between the two photos are checked geometrically. Result: a copy, with a side-by-side picture as proof; no matching points, no copy. Screenshots found: 18% for the best published method, 76.3% for this system, measured on different photo sets.</title><rect x="0.5" y="0.5" width="939" height="469" rx="12" fill="#161b22" stroke="#3d444d"/><rect x="24" y="30" width="152" height="178" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1.2"/>
