<svg xmlns="http://www.w3.org/2000/svg" width="920" height="548" viewBox="0 0 920 548" role="img" aria-label="Everything runs on one small server, an ARM VM with 5.9 GB of RAM, where the CPU goes to the site first. The seller's browser talks to the website and the API, and the API stores results in the database (MongoDB). The API sends every photo to the vision service and only flagged photos to the vlm service, and pauses both during live auctions. vision and vlm sit in a sealed internal network with no internet access, and read their model files from a read-only volume. vision holds 680 MB with its models loaded and 122 MB when idle, with a quarter of the API's CPU weight; vlm holds 1.83 GB loaded and 0.08 GB asleep, with an eighth." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Everything runs on one small server, an ARM VM with 5.9 GB of RAM, where the CPU goes to the site first. The seller's browser talks to the website and the API, and the API stores results in the database (MongoDB). The API sends every photo to the vision service and only flagged photos to the vlm service, and pauses both during live auctions. vision and vlm sit in a sealed internal network with no internet access, and read their model files from a read-only volume. vision holds 680 MB with its models loaded and 122 MB when idle, with a quarter of the API's CPU weight; vlm holds 1.83 GB loaded and 0.08 GB asleep, with an eighth.</title><rect x="0.5" y="0.5" width="919" height="547" rx="12" fill="#161b22" stroke="#3d444d"/><rect x="24" y="88" width="100" height="72" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
