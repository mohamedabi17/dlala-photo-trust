<svg xmlns="http://www.w3.org/2000/svg" width="920" height="396" viewBox="0 0 920 396" role="img" aria-label="A listing photo's journey on Dlala's own server, which no photo leaves. The seller uploads a photo. Step 1, fast checks, runs on every photo: photo fingerprint, restricted objects, written text and faces. Step 2, a small vision model, runs only if step 1 flagged something; a photo not flagged goes straight to step 3. Step 3 decides: approve, blur, remove, refuse or wait. The checks run while the seller fills in the rest of the form; when the seller submits, the result is ready." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>A listing photo's journey on Dlala's own server, which no photo leaves. The seller uploads a photo. Step 1, fast checks, runs on every photo: photo fingerprint, restricted objects, written text and faces. Step 2, a small vision model, runs only if step 1 flagged something; a photo not flagged goes straight to step 3. Step 3 decides: approve, blur, remove, refuse or wait. The checks run while the seller fills in the rest of the form; when the seller submits, the result is ready.</title><rect x="0.5" y="0.5" width="919" height="395" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="20" y="20" width="880" height="284" rx="14" fill="none" stroke="#8250df" stroke-width="1.8" stroke-dasharray="7 5"/>
